<!doctype html>
<html lang="sv" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signalen</title>
<meta name="description" content="Daglig marknadsanalys för svenska och globala börsen.">
<meta name="theme-color" content="#0f1a18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Signalen">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #0f1a18;
    --card: #172624;
    --card-raised: #1c2e2b;
    --ink: #e9ede7;
    --ink-soft: #a4b2ac;
    --ink-faint: #71827c;
    --line: #29403c;
    --accent: #e3a94b;
    --accent-ink: #1c1206;
    --accent-soft: #3a2e14;
    --buy: #63b18a;
    --buy-soft: #1d3128;
    --sell: #d9806f;
    --sell-soft: #362320;
    --watch: #94aabf;
    --watch-soft: #202b34;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }

  body {
    min-height: 100vh;
    padding-bottom: calc(24px + var(--safe-bottom));
  }

  a { color: inherit; }

  /* ---- app bar ---- */
  .appbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(15, 26, 24, 0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: calc(14px + var(--safe-top)) 18px 12px;
  }

  .appbar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .appbar h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 1.3rem;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .refresh-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    border-radius: 999px;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    font-size: 1rem;
    cursor: pointer;
  }
  .refresh-btn:active { transform: scale(0.94); }
  .refresh-btn.spinning { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tabs {
    display: flex;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    margin-top: 12px;
  }

  .tab {
    flex: 1;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.76rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 9px 0;
    border-radius: 999px;
    color: var(--ink-faint);
    background: none;
    border: none;
    cursor: pointer;
  }
  .tab.active { background: var(--accent); color: var(--accent-ink); }

  .updated-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.66rem;
    color: var(--ink-faint);
    text-align: center;
    margin-top: 8px;
  }

  /* ---- content ---- */
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 18px 16px 0;
  }

  .state-msg {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.92rem;
    padding: 60px 20px;
    line-height: 1.6;
  }
  .state-msg .big { font-size: 1.6rem; display: block; margin-bottom: 10px; }

  .run-date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0 0 12px 2px;
  }

  /* ---- hero card ---- */
  .hero {
    border: 1px solid var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 20px 50px -30px rgba(227, 169, 75, 0.35);
    border-radius: 20px;
    padding: 20px 20px 18px;
    background: linear-gradient(165deg, var(--card-raised), var(--card));
    margin-bottom: 22px;
  }

  .hero-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 600;
    margin-bottom: 8px;
    display: block;
  }

  .hero .flag-company { font-size: 1.4rem; }
  .hero .flag-reason { font-size: 0.96rem; }

  /* ---- bransch groups ---- */
  .group {
    margin-bottom: 26px;
  }

  .group-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0 0 10px 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .group-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .group-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ---- flag card ---- */
  .flag-card {
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px 17px 15px;
    background: var(--card);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .flag-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .flag-company {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 1.08rem;
    line-height: 1.25;
    margin: 0;
  }

  .flag-sector {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.66rem;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 3px;
    display: block;
  }

  .signal-pill {
    flex: none;
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 0.7rem;
    padding: 5px 11px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .signal-pill.köp, .signal-pill.buy { background: var(--buy-soft); color: var(--buy); }
  .signal-pill.sälj, .signal-pill.sell { background: var(--sell-soft); color: var(--sell); }
  .signal-pill.bevaka, .signal-pill.watch { background: var(--watch-soft); color: var(--watch); }
  .signal-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .confidence { display: flex; align-items: center; gap: 8px; }
  .confidence .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.64rem;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .confidence .bars { display: flex; gap: 3px; }
  .confidence .bars i { width: 13px; height: 5px; border-radius: 3px; background: var(--line); display: block; }
  .confidence .bars i.on { background: var(--buy); }
  .confidence .value { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 0.74rem; }

  .flag-reason { margin: 0; font-size: 0.88rem; line-height: 1.52; color: var(--ink); }

  .flag-actions {
    display: flex;
    gap: 8px;
  }

  .flag-action-btn {
    flex: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 9px 6px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .flag-action-btn:active { transform: scale(0.97); }
  .flag-action-btn.active { border-color: var(--accent); color: var(--accent); }
  .flag-action-btn:disabled { opacity: 0.55; }

  .chart-box {
    display: none;
    padding-top: 4px;
  }
  .chart-box.show { display: block; }
  .chart-box svg { display: block; width: 100%; height: auto; }
  .chart-range {
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.62rem;
    color: var(--ink-faint);
    opacity: 0.75;
    margin-top: 2px;
  }
  .chart-meta {
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--ink-faint);
    margin-top: 2px;
    padding-top: 4px;
    border-top: 1px dashed var(--line);
  }
  .chart-meta .up { color: var(--buy); }
  .chart-meta .down { color: var(--sell); }
  .chart-msg {
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink-faint);
    padding: 18px 0;
  }

  .deep-box {
    display: none;
    font-size: 0.86rem;
    line-height: 1.55;
    color: var(--ink-soft);
    background: var(--card-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 13px;
  }
  .deep-box.show { display: block; }

  .flag-source {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--accent);
    padding-top: 8px;
    border-top: 1px dashed var(--line);
    text-decoration: none;
    word-break: break-word;
  }

  .outcome-row {
    display: flex;
    gap: 8px;
    margin-top: 2px;
  }

  .outcome-btn {
    flex: 1;
    font-family: 'Manrope', sans-serif;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 8px 4px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .outcome-btn:active { transform: scale(0.97); }
  .outcome-btn.selected.ratt { background: var(--buy-soft); border-color: var(--buy); color: var(--buy); }
  .outcome-btn.selected.fel { background: var(--sell-soft); border-color: var(--sell); color: var(--sell); }
  .outcome-btn.selected.oklart { background: var(--watch-soft); border-color: var(--watch); color: var(--watch); }
  .outcome-btn:disabled { opacity: 0.5; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(20px + var(--safe-bottom));
    transform: translateX(-50%) translateY(20px);
    background: var(--card-raised);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
    z-index: 50;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .refresh-btn.spinning { animation: none; }
    .toast { transition: none; }
  }
</style>
</head>
<body>

<div class="appbar">
  <div class="appbar-row">
    <h1>Signalen</h1>
    <button class="refresh-btn" id="refreshBtn" type="button" aria-label="Uppdatera">↻</button>
  </div>
  <div class="tabs">
    <button class="tab active" data-market="se" type="button">SE</button>
    <button class="tab" data-market="global" type="button">GLOBAL</button>
  </div>
  <div class="updated-line" id="updatedLine">Laddar …</div>
</div>

<main id="main">
  <div class="state-msg"><span class="big">⏳</span>Hämtar senaste analysen …</div>
</main>

<div class="toast" id="toast"></div>

<script>
  const API_BASE = 'https://adrian00z00.app.n8n.cloud/webhook';
  const OUTCOME_SECRET = 'cf83a82dd194e9729999f0aa49221710';

  let currentMarket = 'se';
  let data = null;
  let cardFlags = [];

  const mainEl = document.getElementById('main');
  const updatedLine = document.getElementById('updatedLine');
  const refreshBtn = document.getElementById('refreshBtn');
  const toastEl = document.getElementById('toast');

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMarket = btn.dataset.market;
      render();
    });
  });

  refreshBtn.addEventListener('click', () => load(true));

  mainEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.flag-action-btn');
    if (!btn) return;
    const idx = +btn.dataset.idx;
    const flag = cardFlags[idx];
    if (!flag) return;
    if (btn.dataset.action === 'chart') toggleChart(idx, flag, btn);
    else toggleDeep(idx, flag, btn);
  });

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  function confBars(level) {
    const map = { 'Hög': 3, 'Medel': 2, 'Låg': 1 };
    const n = map[level] || 0;
    let html = '<span class="bars">';
    for (let i = 0; i < 3; i++) html += '<i class="' + (i < n ? 'on' : '') + '"></i>';
    html += '</span>';
    return html;
  }

  function signalClass(signal) {
    return (signal || '').toLowerCase();
  }

  function sourceHost(url) {
    try { return new URL(url).hostname.replace('www.', ''); } catch (e) { return url; }
  }

  function outcomeRow(flag) {
    const opts = [
      { v: 'Rätt', cls: 'ratt', label: '✓ Rätt' },
      { v: 'Fel', cls: 'fel', label: '✕ Fel' },
      { v: 'Oklart', cls: 'oklart', label: '— Oklart' }
    ];
    let html = '<div class="outcome-row" data-id="' + flag.id + '">';
    opts.forEach(o => {
      const selected = flag.utfall === o.v ? ' selected ' + o.cls : '';
      html += '<button class="outcome-btn' + selected + '" data-value="' + o.v + '" type="button">' + o.label + '</button>';
    });
    html += '</div>';
    return html;
  }

  function registerFlag(flag) {
    cardFlags.push(flag);
    return cardFlags.length - 1;
  }

  function actionsHtml(flag, idx) {
    let html = '<div class="flag-actions">';
    if (flag.ticker) {
      html += '<button class="flag-action-btn" data-action="chart" data-idx="' + idx + '" type="button">📈 Graf</button>';
    }
    html += '<button class="flag-action-btn" data-action="deep" data-idx="' + idx + '" type="button">🔍 Förklara djupare</button>';
    html += '</div>';
    if (flag.ticker) {
      html += '<div class="chart-box" id="chart-' + idx + '"></div>';
    }
    html += '<div class="deep-box" id="deep-' + idx + '"></div>';
    return html;
  }

  function flagCardHtml(flag) {
    const idx = registerFlag(flag);
    return (
      '<div class="flag-card">' +
        '<div class="flag-top">' +
          '<div>' +
            '<p class="flag-company">' + flag.bolag + '</p>' +
            (flag.bransch ? '<span class="flag-sector">' + flag.bransch + '</span>' : '') +
          '</div>' +
          '<span class="signal-pill ' + signalClass(flag.signal) + '"><span class="dot"></span>' + flag.signal + '</span>' +
        '</div>' +
        '<div class="confidence"><span class="label">Konfidensgrad</span>' + confBars(flag.konfidensgrad) + '<span class="value">' + flag.konfidensgrad + '</span></div>' +
        '<p class="flag-reason">' + flag.motivering + '</p>' +
        actionsHtml(flag, idx) +
        (flag.källa ? '<a class="flag-source" href="' + flag.källa + '" target="_blank" rel="noopener">↗ ' + sourceHost(flag.källa) + '</a>' : '') +
        (flag.id ? outcomeRow(flag) : '') +
      '</div>'
    );
  }

  function render() {
    const market = data ? data[currentMarket] : null;

    if (!data) {
      mainEl.innerHTML = '<div class="state-msg"><span class="big">⚠️</span>Kunde inte hämta data just nu. Dra ner för att försöka igen.</div>';
      return;
    }

    if (!market) {
      mainEl.innerHTML = '<div class="state-msg"><span class="big">📭</span>Ingen körning loggad ännu för ' + (currentMarket === 'se' ? 'SE' : 'Global') + '.</div>';
      updatedLine.textContent = 'Senast uppdaterad: ' + formatTime(data.uppdaterad);
      return;
    }

    cardFlags = [];
    let html = '<p class="run-date">' + market.datum + ' — ' + market.körning + '</p>';

    if (market.topp) {
      html += '<div class="hero"><span class="hero-eyebrow">🟢 Toppflagga</span>' + flagCardInner(market.topp) + '</div>';
    }

    market.brancher.forEach(bransch => {
      const flags = market.grupper[bransch] || [];
      if (flags.length === 0) return;
      html += '<div class="group"><p class="group-title">' + bransch + '</p><div class="group-list">';
      flags.forEach(f => { html += flagCardHtml(f); });
      html += '</div></div>';
    });

    mainEl.innerHTML = html;
    updatedLine.textContent = 'Senast uppdaterad: ' + formatTime(data.uppdaterad);
    bindOutcomeButtons();
  }

  function flagCardInner(flag) {
    const idx = registerFlag(flag);
    return (
      '<div class="flag-top">' +
        '<div>' +
          '<p class="flag-company">' + flag.bolag + '</p>' +
          (flag.bransch ? '<span class="flag-sector">' + flag.bransch + '</span>' : '') +
        '</div>' +
        '<span class="signal-pill ' + signalClass(flag.signal) + '"><span class="dot"></span>' + flag.signal + '</span>' +
      '</div>' +
      '<div class="confidence"><span class="label">Konfidensgrad</span>' + confBars(flag.konfidensgrad) + '<span class="value">' + flag.konfidensgrad + '</span></div>' +
      '<p class="flag-reason">' + flag.motivering + '</p>' +
      actionsHtml(flag, idx) +
      (flag.källa ? '<a class="flag-source" href="' + flag.källa + '" target="_blank" rel="noopener">↗ ' + sourceHost(flag.källa) + '</a>' : '') +
      (flag.id ? outcomeRow(flag) : '')
    );
  }

  function toggleChart(idx, flag, btn) {
    const box = document.getElementById('chart-' + idx);
    if (!box) return;
    if (box.classList.contains('show')) {
      box.classList.remove('show');
      btn.classList.remove('active');
      return;
    }
    box.classList.add('show');
    btn.classList.add('active');
    if (box.dataset.loaded) return;
    box.innerHTML = '<div class="chart-msg">Laddar graf …</div>';
    fetch(API_BASE + '/kursdata?ticker=' + encodeURIComponent(flag.ticker), { cache: 'no-store' })
      .then(r => r.json())
      .then(d => {
        box.dataset.loaded = '1';
        renderChartSvg(box, d);
      })
      .catch(() => { box.innerHTML = '<div class="chart-msg">Kunde inte hämta graf just nu.</div>'; });
  }

  function renderChartSvg(box, d) {
    if (!d.ok || !d.points || d.points.length < 2) {
      box.innerHTML = '<div class="chart-msg">Ingen kursdata tillgänglig.</div>';
      return;
    }
    const pts = d.points;
    const values = pts.map(p => p.c);
    const min = Math.min(...values);
    const max = Math.max(...values);
    const range = (max - min) || 1;
    const w = 300, h = 80, pad = 4;
    const stepX = (w - pad * 2) / (pts.length - 1);
    const coords = values.map((v, i) => {
      const x = pad + i * stepX;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return x.toFixed(1) + ',' + y.toFixed(1);
    });
    const up = (d.forandring || 0) >= 0;
    const stroke = up ? '#63b18a' : '#d9806f';
    const line = coords.join(' ');
    const svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<polyline points="' + line + '" fill="none" stroke="' + stroke + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '</svg>';
    const changeCls = up ? 'up' : 'down';
    const changeSign = up ? '+' : '';
    const periodStart = formatChartDate(pts[0].t);
    const periodEnd = formatChartDate(pts[pts.length - 1].t);
    const change = (typeof d.forandring === 'number') ? (changeSign + d.forandring.toFixed(1) + '%') : '–';
    box.innerHTML = svg +
      '<div class="chart-range"><span>' + periodStart + '</span><span>' + periodEnd + '</span></div>' +
      '<div class="chart-meta"><span>' + (d.ticker || '') + (d.valuta ? ' · ' + d.valuta : '') + '</span>' +
      '<span class="' + changeCls + '">' + change + ' över perioden</span></div>';
  }

  function formatChartDate(ms) {
    const d = new Date(ms);
    return d.toLocaleDateString('sv-SE', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function toggleDeep(idx, flag, btn) {
    const box = document.getElementById('deep-' + idx);
    if (!box) return;
    if (box.classList.contains('show')) {
      box.classList.remove('show');
      btn.classList.remove('active');
      return;
    }
    box.classList.add('show');
    btn.classList.add('active');
    if (box.dataset.loaded) return;
    box.textContent = 'Analyserar djupare …';
    btn.disabled = true;
    fetch(API_BASE + '/forklara-djupare', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        bolag: flag.bolag,
        bransch: flag.bransch,
        signal: flag.signal,
        konfidensgrad: flag.konfidensgrad,
        motivering: flag.motivering,
        källa: flag.källa
      })
    })
      .then(r => r.json())
      .then(d => {
        box.dataset.loaded = '1';
        box.textContent = d.forklaring || 'Kunde inte generera en djupare analys just nu.';
      })
      .catch(() => { box.textContent = 'Kunde inte hämta djupare analys just nu — försök igen.'; })
      .finally(() => { btn.disabled = false; });
  }

  function bindOutcomeButtons() {
    document.querySelectorAll('.outcome-row').forEach(row => {
      const id = row.dataset.id;
      row.querySelectorAll('.outcome-btn').forEach(btn => {
        btn.addEventListener('click', () => markOutcome(id, btn.dataset.value, row));
      });
    });
  }

  async function markOutcome(id, utfall, rowEl) {
    rowEl.querySelectorAll('.outcome-btn').forEach(b => b.disabled = true);
    try {
      const res = await fetch(API_BASE + '/markera-utfall', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: OUTCOME_SECRET, id, utfall })
      });
      if (!res.ok) throw new Error('bad status');
      rowEl.querySelectorAll('.outcome-btn').forEach(b => {
        b.classList.remove('selected', 'ratt', 'fel', 'oklart');
      });
      const chosen = rowEl.querySelector('[data-value="' + utfall + '"]');
      const clsMap = { 'Rätt': 'ratt', 'Fel': 'fel', 'Oklart': 'oklart' };
      chosen.classList.add('selected', clsMap[utfall]);
      showToast('Markerat: ' + utfall);
    } catch (e) {
      showToast('Kunde inte spara — försök igen');
    } finally {
      rowEl.querySelectorAll('.outcome-btn').forEach(b => b.disabled = false);
    }
  }

  function formatTime(iso) {
    if (!iso) return '–';
    const d = new Date(iso);
    return d.toLocaleDateString('sv-SE') + ' ' + d.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
  }

  async function load(manual) {
    if (manual) refreshBtn.classList.add('spinning');
    try {
      const res = await fetch(API_BASE + '/marknadsdata', { cache: 'no-store' });
      data = await res.json();
    } catch (e) {
      data = data || null;
    }
    render();
    if (manual) setTimeout(() => refreshBtn.classList.remove('spinning'), 400);
  }

  load(false);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
